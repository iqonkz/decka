[package]
name = "decka-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[[bin]]
name = "decka-headless"
path = "src/bin/decka-headless.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = "0.3.34"
local-ip-address = "0.6.13"
notify = "8.2.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

[target."cfg(windows)".dependencies]
enigo = "0.6.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_WinRT", "Media_Control", "Storage_Streams", "Graphics_Imaging", "Win32_UI_Shell", "Win32_Globalization", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Foundation", "Foundation_Collections"] }
