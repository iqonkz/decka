[package]
name = "decka-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[[bin]]
name = "decka-headless"
path = "src/bin/decka-headless.rs"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal", "fs"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
