[workspace]
members = ["agent/core", "agent/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.10.1"
edition = "2021"
license = "MIT"

[profile.dev]
debug = "line-tables-only"

# Dependencies are built without debug info: a much smaller target\debug; our own crates keep theirs.
[profile.dev.package."*"]
debug = false
