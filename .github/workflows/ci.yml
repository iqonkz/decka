name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w client
      - run: cargo test -p decka-core
      - run: npm run build:ui
      - run: cargo build -p decka-agent

  # Screens against tools/visual-baseline (T31.1). Not required for a merge: fonts and rendering of the
  # runner may differ from the machine that wrote the baselines.
  visual:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/voice-shots.mjs --compare .tmp/visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: .tmp/visual
          include-hidden-files: true
